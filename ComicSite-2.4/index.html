<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<div class="overflow-hidden w-full grid grid-cols-5 bg-purple-800 border-2 border-gray-950">
    <button class="text-white col-span-2 hover:bg-red-600 transition duration-300 active:bg-red-400 px-4 border-gray-950 border">
        MARVEL
    </button>
    <button class="mx-auto h-8 sm:h-16 active:h-12 transition duration-300">
        <img src="Images\marvel_dc-3.png" />
    </button>
    <button class="text-white col-span-2 active:bg-blue-400 hover:bg-blue-800 px-4 transition duration-300 border-gray-950 border">
        DC
    </button>
</div>

<div class="w-full overflow-hidden bg-purple-700">
    <div class="flex items-center -ml-[50vw] -mr-[50vw] md:hidden  border-2 border-purple-950"> <!--Image that extends outside of the screen edge, displayed on mobile-->
        <img src="Images\marvel vs dc.jpg"/>
    </div>
    <div class="hidden md:block md:w-3/4 md:mx-auto border-2 border-purple-950"> <!--Image that extends exatly to the screen edge, uses the other image type on mobile-->
        <img src="Images\marvel vs dc.jpg"/>
    </div>
</div>

<div class="grid md:grid-cols-2 grid-cols-1 gap-2 block place-items-center w-full h-7/8 md:h-screen xl:h-[vh-150] md:p-16 p-8 from-gray-950 bg-gradient-to-b to-blue-900"> <!--displays Marvel and DC images side-by-side-->
    <div class="flex items-center justify-center grid overflow-hidden rounded-lg w-1/2 md:w-3/4 max-h-full 2xl:w-1/2 shadow-md hover:shadow-2xl active:shadow-sm"> <!--groups the Marvel image and Marvel logo together in a grid within the same slot to place the logo over the image-->
        <img src="Images\Avengers.jpg" class="col-start-1 row-start-1 w-full h-auto"/>
        <img src="Images\MarvelLogoPNG.png" class="col-start-1 row-start-1 w-1/2 h-auto mx-auto my-4"/>
    </div>
    <div class="flex items-center justify-center grid overflow-hidden rounded-lg w-1/2 md:w-3/4 max-h-full 2xl:w-1/2 shadow-md hover:shadow-2xl active:shadow-sm"> <!--groups the DC image and DC logo together in a grid within the same slot to place the logo over the image-->
        <img src="Images\JusticeLeague.jpg" class="col-start-1 row-start-1 w-full h-auto"/>
        <img src="Images\DCLogoBlue.png" class="col-start-1 row-start-1 w-1/2 h-auto mx-auto my-4"/>
    </div>
</div>

<div class="w-full h-screen bg-blue-900">
</div>

</html>
